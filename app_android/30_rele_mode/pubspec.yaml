name: bomba_esp
description: "App para controlar bomba ESP32 vía Bluetooth BLE"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth BLE
  flutter_blue_plus: ^1.31.0

  # State Management
  provider: ^6.0.0

  # Permisos
  permission_handler: ^11.0.0

  # Navegación
  go_router: ^12.0.0

  # Utilidades
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
